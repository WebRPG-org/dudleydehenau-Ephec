<!--Pour avoir les icones-->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

<!--La barre de navigation du haut de la page-->
<app-barre-navigation></app-barre-navigation>


<!--La barre de navigation sur le côté gauche de la page-->
<mat-sidenav-container style="background-color: #1e1e1e;">
    <mat-sidenav class="sidenav" mode="side" opened>
      <mat-toolbar>
        <div class="notification">
          <div class="notificationTitre">Notifications</div>
          <div class="contenuNotification">
            <app-notification-tri-en-cours *ngIf="notificationVisible"></app-notification-tri-en-cours>
            <app-erreur-notification *ngIf="notificationErrorVisible"></app-erreur-notification>
            <app-attention-notification [notifications]="composantsFaibleQuantite"></app-attention-notification>
          </div>
        </div>
      </mat-toolbar>
    </mat-sidenav>
    <mat-sidenav-content>

      <!--Le contenu de la page-->
      <div class="contenuPage">
        <router-outlet></router-outlet>
      </div>
      
    </mat-sidenav-content>
  </mat-sidenav-container>
